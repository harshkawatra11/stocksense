[project]
name = "stocksense"
version = "0.1.0"
description = "Quant brain for the NSE — Phase 0: prove the economics before building the product."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    # Phase K0: evaluation/robustness.py uses scipy.stats.norm directly (the
    # Deflated Sharpe Ratio and its expected-maximum-Sharpe term). scipy was
    # already installed here, but only TRANSITIVELY via scikit-learn -- the
    # exact shape of the pyyaml gap this project already hit once, where a
    # test passed locally and would have failed on a clean CI install.
    "scipy>=1.11",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "yfinance>=0.2.40",
    "structlog>=24.1",
    "joblib>=1.3",
    "requests>=2.31",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "smartapi-python>=1.5",
    "pyotp>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
# Phase G/E1: lets `stocksense <command>` work as a bare command after
# `pip install -e .`, instead of only `python -m stocksense.cli.main
# <command>` (what server/jobs.py and desktop/main.js both still use
# internally, unchanged -- this is an added convenience for direct
# terminal use, not a replacement for the module-invocation path
# everything else already depends on).
stocksense = "stocksense.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
