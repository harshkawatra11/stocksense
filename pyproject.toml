[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksense"
version = "3.0.0"
description = "A local quant stack that researches and trades NSE cash equities intraday."
requires-python = ">=3.13"

# Every dependency is declared EXPLICITLY, including ones that would otherwise
# arrive transitively. This repo has been bitten before: pyyaml was present only
# via another package, so the suite passed locally and failed on a clean install.
dependencies = [
    # data spine
    "duckdb>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=17",
    "requests>=2.32",
    "httpx>=0.27",
    # research / stats  (scipy is used directly by evaluation/robustness.py)
    # UPPER BOUND IS LOAD-BEARING, not tidiness: this machine has Windows Smart
    # App Control ON (VerifiedAndReputablePolicyState=1). SAC blocks unsigned
    # binaries that lack download reputation, and scipy 1.18.x wheels are new
    # enough that its compiled .pyd files are blocked -- "DLL load failed while
    # importing cython_lapack: An Application Control policy has blocked this
    # file". Measured: 1.16.0/1.16.3/1.17.1 all load fine, 1.18.1 does not, on
    # both Python 3.12 and 3.14. Raise this ceiling only after verifying the
    # new version actually imports on this machine.
    "scipy>=1.11,<1.18",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "hmmlearn>=0.3",
    "numba>=0.60",
    # market data
    "yfinance>=0.2.40",
    "finvizfinance>=1.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # broker
    "smartapi-python>=1.5",
    "logzero>=1.7",  # smartapi-python imports it but does not declare it
    "pyotp>=2.9",
    "websocket-client>=1.8",
    # app
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# GPU Monte Carlo. Installed separately because the CUDA wheel is large and the
# whole pipeline must run without it (simulation/montecarlo.py falls back to a
# numba.prange CPU path whenever CuPy is absent or the GPU lease is held).
gpu = ["cupy-cuda12x>=13.0"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "freezegun>=1.5"]

[project.scripts]
stocksense = "stocksense.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits a real external API; skipped unless STOCKSENSE_LIVE_TESTS=1",
    "slow: takes more than ~5s",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
