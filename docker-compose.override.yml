# Local override — avoids clashing with the host's native PostgreSQL 18
# already listening on 5432. Maps the StockSense DB to 5433.
# (This file IS tracked in git, despite an earlier stale comment saying
# otherwise — it's environment-specific, but harmless/needed for anyone
# running this repo alongside a native Postgres install on the same port.)
#
# `!override` (not the default merge) is required here: Compose otherwise
# CONCATENATES the `ports` list from docker-compose.yml (5432:5432) with this
# file's (5433:5432), leaving the container double-published on both host
# ports — which silently re-collides with the native Postgres this override
# exists to avoid.
services:
  db:
    ports: !override
      - "5433:5432"
