name: verify

# The independent referee (docs/19-foreman.md). The Foreman may only
# self-merge a goal branch on a GREEN RUN OF THIS WORKFLOW, queried via
# `gh run list` -- never on its own local test run. A verifier the agent
# can influence from inside its own environment is not a verifier.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full test suite
        run: pytest tests/unit -q

      # Run separately (not just as part of the full suite above) so a
      # leakage failure is legible in the check name, not buried in a log.
      - name: Leakage suite
        run: pytest tests/unit/test_leakage.py -v

      - name: Determinism suite
        run: pytest tests/unit/test_determinism.py -v

      - name: Verify no secrets committed
        run: |
          if git log --all --full-history -- .env | grep -q .; then
            echo "::error::.env appears in git history"
            exit 1
          fi
          if [ -f .env ]; then
            echo "::error::.env is present in the checkout (should be gitignored)"
            exit 1
          fi
