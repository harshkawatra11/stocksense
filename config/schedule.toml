# T10.4: the all-day job table (IST). One [[job]] per scheduled activity.
#   name            job key in job_runs (a job with several `at` times is keyed name@HH:MM)
#   fn              implementation in live.jobs.JOBS (default: name)
#   at              "HH:MM[:SS]" or a list of them
#   every_s / until repeat every N seconds from `at` up to `until`; for one-shot jobs `until` ends the retries
#   days            session | any | nonsession | saturday | first_saturday
#   max_retries     extra attempts after a failed one; retry_backoff_s is the wait between attempts
#   needs_market    only inside the session's open..close window
#   late_after      a first run after this time is recorded as `skipped: late`
#   after           run only once this job has finished for the day
# Extra trading sessions (weekend specials, Muhurat) go in [[special_sessions]]:
#   [[special_sessions]]
#   date = "2027-02-01"
#   open = "09:15"
#   close = "15:30"
#   tradable = true
special_sessions = []

