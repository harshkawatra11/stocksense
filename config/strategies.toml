[s1]                         # multi-day delivery book
product = "delivery"
entry = "close"              # buy at C(t+1)
exit = "open"                # sell at O(t+1+h)
targets = ["y_c2o_5", "y_c2o_10", "y_c2o_20"]
universe = "u500"
long_only = true
k_max = 20
score_ema = 5                # G2-C5 winner g2-s1cost-y_c2o_10-40f8615b42 (V8); not yet validated by the gate
er_map = "decile"
[s1.policy]                  # S1Policy(policy_opts=); max_fixed_cost_bps overrides risk.toml for S1 only
exit_rank = 50
min_hold = 5
free_extension = true
rebuy_block = 5
switch_hurdle = true
max_fixed_cost_bps = 10
[s2]                         # same-day auction book
product = "intraday"
entry = "open"               # O(t+1), decided 09:07 from pre-open indicative prices
exit = "close_minus"         # squared off 15:18
targets = ["y_oc"]
universe = "u200"
long_only = false
shorts_require_fno = true
k_max = 10
[s3]
enabled = false              # event sleeve, switched on in Phase 8
max_capital_frac = 0.30
